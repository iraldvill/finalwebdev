services:
  vgc-mysql:
    image: mysql:8.0
    container_name: vgc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - vgc-db-data:/var/lib/mysql
    networks:
      - vgc-network

  vgc-phpmyadmin:
    image: phpmyadmin
    container_name: vgc-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: vgc-mysql
    ports:
      - "8080:80"
    networks:
      - vgc-network

volumes:
  vgc-db-data:

networks:
  vgc-network: