security:
    # How passwords are hashed ("auto" picks the best algorithm available)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Users are loaded from the database, found by their email
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_home

    # Role-based route protection
    # Not logged in -> redirected to /login. Logged in without the role -> 403.
    access_control:
        - { path: ^/dashboard, roles: ROLE_ADMIN }